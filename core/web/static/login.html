<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>frx — вход</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='30 28 48 52'%3E%3Cdefs%3E%3ClinearGradient id='a' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23ff2a1c'/%3E%3Cstop offset='.55' stop-color='%23ff5a14'/%3E%3Cstop offset='1' stop-color='%23ff8a00'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath fill='url(%23a)' d='M38,32h34l-5,8h-21v10h17l-5,8h-12v18h-8z'/%3E%3Cpath fill='%23ff8a00' fill-opacity='.6' d='M60,62l12,7l-12,7z'/%3E%3C/svg%3E">
  <link rel="apple-touch-icon" href="/static/icon.png">
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/accent.css">
  <link rel="stylesheet" href="/static/login.css">
</head>
<body>
  <div id="bg"></div>
  <main class="lg">
    <div class="glass lg-box">
      <img class="lg-mark" src="/static/logo.svg" alt="" aria-hidden="true">
      <div class="lg-word">FRX</div>
      <div class="lg-sub">вход на сайт управления</div>
      <div id="lg-tg" class="lg-step" hidden><div class="lg-note">вход через Telegram…</div></div>
      <div id="lg-closed" class="lg-step" hidden>
        <div class="lg-lock" aria-hidden="true"></div>
        <div class="lg-title">вход закрыт</div>
        <div class="lg-note">Напишите <code>.web</code> в любом чате Telegram — придёт код, и вход откроется на 10 минут для одного устройства. Эта страница откроется сама.</div>
      </div>
      <div id="lg-code" class="lg-step" hidden>
        <div class="lg-note" id="lg-where">Код из 5 цифр — в ЛС от вашего бота (без бота — в «Избранном»).</div>
        <input class="field lg-input" id="lg-input" inputmode="numeric" pattern="[0-9]*" maxlength="5" autocomplete="one-time-code" placeholder="•••••" aria-label="код из Telegram">
        <button class="btn primary lg-wide" id="lg-go" type="button">войти</button>
        <button class="link lg-again" id="lg-again" type="button">прислать новый код</button>
        <div class="lg-left" id="lg-left"></div>
      </div>
      <div class="lg-msg" id="lg-msg" role="status"></div>
    </div>
  </main>
  <script src="/static/login.js"></script>
</body>
</html>
